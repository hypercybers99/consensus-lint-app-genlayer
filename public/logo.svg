<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="976" height="976" rx="200" fill="none" stroke="#334155" stroke-width="8" opacity="0.4" />

  <!-- Outer Consensus Geometric Lattice -->
  <g transform="translate(512, 512)">
    <!-- Pentagonal Validator Orbit (5 nodes for 3/5 majority consensus) -->
    <!-- Node 1: Top -->
    <line x1="0" y1="-260" x2="247" y2="-80" stroke="#475569" stroke-width="8" stroke-dasharray="12 12" />
    <line x1="247" y1="-80" x2="153" y2="210" stroke="#475569" stroke-width="8" stroke-dasharray="12 12" />
    <line x1="153" y1="210" x2="-153" y2="210" stroke="#475569" stroke-width="8" stroke-dasharray="12 12" />
    <line x1="-153" y1="210" x2="-247" y2="-80" stroke="#475569" stroke-width="8" stroke-dasharray="12 12" />
    <line x1="-247" y1="-80" x2="0" y2="-260" stroke="#475569" stroke-width="8" stroke-dasharray="12 12" />

    <!-- Central Diamond Core representing AST & Rule verification -->
    <path d="M 0 -170 L 170 0 L 0 170 L -170 0 Z" fill="#1e293b" stroke="url(#nodeGrad)" stroke-width="14" filter="url(#glow)" />

    <!-- Validator Nodes -->
    <circle cx="0" cy="-260" r="42" fill="url(#crestGrad)" stroke="#ecfdf5" stroke-width="8" />
    <circle cx="247" cy="-80" r="42" fill="url(#crestGrad)" stroke="#ecfdf5" stroke-width="8" />
    <circle cx="153" cy="210" r="42" fill="url(#crestGrad)" stroke="#ecfdf5" stroke-width="8" />
    <circle cx="-153" cy="210" r="42" fill="#64748b" stroke="#94a3b8" stroke-width="6" />
    <circle cx="-247" cy="-80" r="42" fill="url(#crestGrad)" stroke="#ecfdf5" stroke-width="8" />

    <!-- Internal Prism / Consensus Beam (3 agree rays) -->
    <line x1="0" y1="0" x2="0" y2="-260" stroke="#34d399" stroke-width="10" />
    <line x1="0" y1="0" x2="247" y2="-80" stroke="#34d399" stroke-width="10" />
    <line x1="0" y1="0" x2="-247" y2="-80" stroke="#34d399" stroke-width="10" />

    <!-- Core Checkmark Glyph -->
    <path d="M -54 6 L -16 46 L 64 -36" fill="none" stroke="#f8fafc" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
